# Generated by ci/github/generate_jet_workflows.py from ci/jobs.json; rerun it after changing workloads.
name: JET gb300

on:
  workflow_dispatch:
    inputs:
      gb300-native-detr-nano4-8x4:
        description: gb300-native-detr-nano4-8x4 (default)
        type: boolean
        default: false
      gb300-native-perf-nano4-8x4:
        description: gb300-native-perf-nano4-8x4 (default)
        type: boolean
        default: false
      gb300-nvrx-detr-nano4-8x4:
        description: gb300-nvrx-detr-nano4-8x4 (nvrx)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  select:
    runs-on: [self-hosted, jet]
    timeout-minutes: 10
    outputs:
      workloads: ${{ steps.select.outputs.workloads }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        run: ci/github/jet.sh select
        env:
          JET_INPUTS: ${{ toJSON(inputs) }}

  wheel:
    needs: select
    runs-on: [self-hosted, build]
    timeout-minutes: 180
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/github/tasks.sh wheel-aarch64
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: wheel-aarch64
          path: dist/
          retention-days: 7

  jet:
    needs: [select, wheel]
    uses: ./.github/workflows/jet.yml
    with:
      platform: gb300
      workloads: ${{ needs.select.outputs.workloads }}
      wheel-aarch64-artifact-id: ${{ needs.wheel.outputs.artifact-id }}
    secrets:
      JET_GITLAB_TOKEN: ${{ secrets.JET_GITLAB_TOKEN }}
