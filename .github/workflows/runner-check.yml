name: Runner check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/runner-check.yml

permissions:
  contents: read

jobs:
  self-hosted:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Host
        run: |
          uname -a
          grep PRETTY_NAME /etc/os-release
          echo "user=$(id -un) groups=$(id -Gn)"
          echo "cpus=$(nproc)"
          free -g
          df -h "$RUNNER_TEMP" /tmp
          df -h /var/lib/docker 2>/dev/null || true

      - name: Tools
        run: |
          missing=0
          for tool in git python3 curl docker; do
            if path=$(command -v "$tool"); then
              echo "$tool: $path"
            else
              echo "$tool: missing"
              missing=1
            fi
          done
          python3 --version
          if python3 -m venv "$RUNNER_TEMP/venv-check"; then
            echo "python3 venv: works"
          else
            missing=1
          fi
          docker version --format 'docker client {{.Client.Version}}, server {{.Server.Version}}' || missing=1
          exit "$missing"

      - name: Network
        if: ${{ !cancelled() }}
        run: |
          unreachable=0
          while read -r url; do
            code=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$url" 2>/dev/null || true)
            echo "${code:-000} $url"
            [[ "${code:-000}" != 000 ]] || unreachable=1
          done <<'EOF'
          https://github.com
          https://gitlab-master.nvidia.com/api/v4/version
          https://jet.nvidia.com/api/docs
          https://sc-hw-artf.nvidia.com/artifactory/api/pypi/hw-joc-pypi/simple/jet-client/
          https://gpuwa.nvidia.com/elasticsearch/
          https://nvcr.io/v2/
          https://pypi.org/simple/pip/
          EOF
          exit "$unreachable"

      - name: jet-client from Artifactory
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/jet-client"
          "$RUNNER_TEMP/jet-client/bin/pip" install --quiet --no-cache-dir "jet-client==4.58.4" \
            --index-url https://sc-hw-artf.nvidia.com/artifactory/api/pypi/hw-joc-pypi/simple
          "$RUNNER_TEMP/jet-client/bin/python" -c 'import importlib.metadata as m; print("jet-client", m.version("jet-client"))'

      - name: JET accepts the stored GitLab token
        if: ${{ !cancelled() }}
        env:
          JET_GITLAB_TOKEN: ${{ secrets.JET_GITLAB_TOKEN }}
        run: |
          status=$(curl -sS -m 30 -o "$RUNNER_TEMP/jet-me.json" -w '%{http_code}' \
            -H "Authorization: Bearer $JET_GITLAB_TOKEN" https://jet.nvidia.com/api/auth/v1/me)
          echo "HTTP $status"
          python3 -c 'import json, sys; me = json.load(open(sys.argv[1])); print({key: me.get(key) for key in ("username", "detail")})' "$RUNNER_TEMP/jet-me.json"
          [[ "$status" == 200 ]]
