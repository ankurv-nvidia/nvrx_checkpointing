        description: gb200-nvrx-perf-ultra3fp8-64x4 (nvrx)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  select:
    runs-on: [self-hosted, jet]
    timeout-minutes: 10
    outputs:
      workloads: ${{ steps.select.outputs.workloads }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        run: ci/github/jet.sh select
        env:
          JET_INPUTS: ${{ toJSON(inputs) }}

  wheel:
    needs: select
    runs-on: [self-hosted, build]
    timeout-minutes: 180
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/github/tasks.sh wheel-aarch64
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: wheel-aarch64
          path: dist/
          retention-days: 7

  jet:
    needs: [select, wheel]
    uses: ./.github/workflows/jet.yml
    with:
      platform: gb200
      workloads: ${{ needs.select.outputs.workloads }}
      wheel-aarch64-artifact-id: ${{ needs.wheel.outputs.artifact-id }}
    secrets:
      JET_GITLAB_TOKEN: ${{ secrets.JET_GITLAB_TOKEN }}

  perf-report:
    needs: jet
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - run: python3 ci/github/perf_report.py summary reports
