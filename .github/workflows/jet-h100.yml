# Generated by ci/github/generate_jet_workflows.py from ci/jobs.json; rerun it after changing workloads.
name: JET h100

on:
  workflow_dispatch:
    inputs:
      h100-native-detr-pico-1x8:
        description: h100-native-detr-pico-1x8 (default)
        type: boolean
        default: false
      h100-native-perf-pico-1x8:
        description: h100-native-perf-pico-1x8 (default)
        type: boolean
        default: false
      h100-native-detr-vg-pico-1x8:
        description: h100-native-detr-vg-pico-1x8 (main-branch-runs)
        type: boolean
        default: false
      h100-nvrx-detr-pico-1x8:
        description: h100-nvrx-detr-pico-1x8 (nvrx)
        type: boolean
        default: false
      h100-nvrx-perf-pico-1x8:
        description: h100-nvrx-perf-pico-1x8 (nvrx)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  select:
    runs-on: [self-hosted, jet]
    timeout-minutes: 10
    outputs:
      workloads: ${{ steps.select.outputs.workloads }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        run: ci/github/jet.sh select
        env:
          JET_INPUTS: ${{ toJSON(inputs) }}

  wheel:
    needs: select
    runs-on: [self-hosted, build]
    timeout-minutes: 180
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/github/tasks.sh wheel
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: wheel-x86_64
          path: dist/
          retention-days: 7

  jet:
    needs: [select, wheel]
    uses: ./.github/workflows/jet.yml
    with:
      platform: h100
      workloads: ${{ needs.select.outputs.workloads }}
      wheel-x86_64-artifact-id: ${{ needs.wheel.outputs.artifact-id }}
    secrets:
      JET_GITLAB_TOKEN: ${{ secrets.JET_GITLAB_TOKEN }}
