# Shared CI templates and wheel jobs. generate-ci.py inserts the platform
# workload matrix at the marker near the end.

stages:
  - build
  - test
  - launch
# >>> generate-ci.py: workload stages <<<

variables:
  PIPELINE_SUITE:
    value: default
    options: [default, nvrx, large-scale, main-branch-runs]
    description: "Workloads to run; non-default suites can be launched separately."
  # Sources every job trains on. Set these to run a candidate Megatron-LM /
  # NVIDIA Resiliency Extension; the digest each run writes is what a later
  # comparison against another run's digest reads. slurm_job.py reads them
  # straight from the environment.
  MEGATRON_REPO_URL:
    value: ""
    description: "Megatron-LM repository the run trains on."
  MEGATRON_COMMIT:
    value: ""
    description: "Megatron-LM commit the run trains on."
  NVRX_REPO_URL:
    value: ""
    description: "NVIDIA Resiliency Extension repository the run trains on."
  NVRX_COMMIT:
    value: ""
    description: "NVIDIA Resiliency Extension commit the run trains on."
  RUN_ALL_SUITES:
    value: "false"
    options: ["false", "true"]
    description: "After the default gates, launch every optional downstream suite."

.default_pipeline:
  rules:
    - if: '$PIPELINE_SUITE == "nvrx" || $PIPELINE_SUITE == "large-scale" || $PIPELINE_SUITE == "main-branch-runs"'
      when: never
    - when: on_success

.ci_base:
  extends: .default_pipeline
  interruptible: false
  retry:
    max: 1
    when: runner_system_failure
  variables:
    CI_SCRIPTS_DIR: "${CI_PROJECT_DIR}/ci/scripts"
    BASELINES_DIR: "${CI_PROJECT_DIR}/ci/baselines"
    RESULTS_DIR: "${CI_PROJECT_DIR}/ci/ci-results"
    METADATA_DIR: "${CI_PROJECT_DIR}/metadata"
  before_script:
    - echo "=== Pipeline ${CI_PIPELINE_ID} | Job ${CI_JOB_ID} | Commit ${CI_COMMIT_SHORT_SHA} ==="
    - echo "=== Running on $(hostname) ==="
    # Load and export every runner-config assignment so entries such as NCCL_NET=IB
    # reach child processes without requiring each line to carry an export. Then export
    # the platform tag (baseline namespace) and cluster (selects srun templates), with
    # fallbacks for local runs. A job-scoped override lets one shared cluster runner
    # target a different hardware partition without its sourced PLATFORM value winning
    # over the CI matrix.
    - set -a
    - source ~/data/ci/config 2>/dev/null || source ~/data/ci 2>/dev/null || true
    - set +a
    - export CLUSTER="${CLUSTER:-devbox}"
    - export PLATFORM="${PLATFORM_OVERRIDE:-${PLATFORM:-${CLUSTER}}}"
    - echo "=== PLATFORM=${PLATFORM} CLUSTER=${CLUSTER} ==="

# Per-runner tag, GPU topology, and CPU arch. Platform and cluster are configured per
# runner at setup. WHEEL_ARCH names the wheel a job may install from the
# pipeline's wheel builds (ci/scripts/wheel_install.py); it lives here because the slurm
# launcher's own arch is not authoritative for the compute nodes.
.runner_gb200:
  tags: [gb200]
  variables:
    GPUS_PER_NODE: "4"
    WHEEL_ARCH: aarch64

.runner_gb300:
  tags: [gb300]
  variables:
    PLATFORM_OVERRIDE: gb300
    GPUS_PER_NODE: "4"
    WHEEL_ARCH: aarch64
    # The Nano4 reference explicitly disables cuDNN fused attention while
    # selecting Megatron's flash attention backend.
    NVTE_FUSED_ATTN: "0"

.runner_h100:
  tags: [h100]
  variables:
    GPUS_PER_NODE: "8"
    WHEEL_ARCH: x86_64

.runner_devbox:
  tags: [devbox]
  variables:
    GPUS_PER_NODE: "2"
    WHEEL_ARCH: x86_64

# Run a job via slurm_job.py. The image build runs in before_script (not a separate job) so
# it lands on the same machine as the workload; it's a fast no-op when already present.
.slurm_job:
  extends: .ci_base
  variables:
    SLURMJOB_OPT_WORK_DIR: "${CI_PROJECT_DIR}/ci/ci-runs"
    # JIT caches are rank-scoped by slurm_job.py. Keep their common root on each
    # compute node instead of making hundreds of ranks write through Lustre.
    TRITON_CACHE_DIR: "/tmp/nvrx-${CI_JOB_ID}/triton-cache"
    TRITON_CACHE_PATH: "/tmp/nvrx-${CI_JOB_ID}/triton-cache"
    TORCHINDUCTOR_CACHE_DIR: "/tmp/nvrx-${CI_JOB_ID}/torchinductor-cache"
    TORCH_EXTENSIONS_DIR: "/tmp/nvrx-${CI_JOB_ID}/torch-extensions"
  before_script:
    - !reference [.ci_base, before_script]
    - if [[ -n "${UPSTREAM_PIPELINE_ID:-}" ]]; then python3 "${CI_SCRIPTS_DIR}/wheel_install.py" --fetch-upstream-wheel; fi
    - python3 "${CI_SCRIPTS_DIR}/prepare_image.py"
  stage: test
  needs: []
  timeout: 8h
  allow_failure:
    exit_codes: [3]
  script:
    - python3 "${CI_SCRIPTS_DIR}/slurm_job.py" ${JOB_ARGS} || exit $?
  after_script:
    - |
      if [[ "${CI_JOB_STATUS:-}" == canceled ]]; then
        while IFS= read -r -d '' marker; do
          [[ "$(<"${marker}")" == "${CI_JOB_ID}" ]] || continue
          job_id="$(<"${marker%/*}/job_id")"
          [[ "${job_id}" =~ ^[0-9]+$ ]] || continue
          echo "Canceling Slurm job ${job_id} for canceled GitLab job ${CI_JOB_ID}"
          scancel -- "${job_id}" || true
        done < <(find ci/ci-runs -mindepth 2 -maxdepth 2 -name gitlab_job_id -print0 2>/dev/null)
      fi
    - du -ch ci/ci-runs/*/checkpoints/iter_*/*.distcp ci/ci-runs/*/*/checkpoints/iter_*/*.distcp 2>/dev/null | tail -n 1 || true
    - if [[ "${CI_JOB_STATUS:-}" == failed ]]; then python3 "${CI_SCRIPTS_DIR}/slurm_job.py" __failure_summary__ ci/ci-runs || true; fi
  artifacts:
    paths:
      - ci/ci-results/*.log
      - ci/ci-results/*_report.json
      - ci/ci-runs/*/logs/*.log
      - ci/ci-runs/*/*/logs/*.log
      - ci/ci-runs/*/logs/*_report.json
      - ci/ci-runs/*/*/logs/*_report.json
      - ci/ci-results/otel/*/*.jsonl
      - ci/ci-runs/*/logs/otel/*/*.jsonl
      - ci/ci-runs/*/*/logs/otel/*/*.jsonl
      # The submitted sbatch script; its header records the exact submit command, so it
      # doubles as a reproducer for re-running the SLURM job by hand.
      - ci/ci-results/*.sbatch
      - ci/ci-runs/*/run.sbatch
      - ci/ci-runs/*/*/run.sbatch
      # What every run's checkpoints contain, and how they compared. Merged
      # back as the baseline a later run is diffed against.
      - ci/ci-runs/*/logs/*_checkpoint_digest.xz
      - ci/ci-runs/*/*/logs/*_checkpoint_digest.xz
      - ci/ci-runs/*/logs/*_checkpoint_summary.log
      - ci/ci-runs/*/*/logs/*_checkpoint_summary.log
      # Drop-in candidates generated from every run's Megatron argument block
      # and from the job's measured checkpoint metrics.
      - ci/ci-runs/*/logs/baselines/*
      - ci/ci-runs/*/*/logs/baselines/*
      # Per-iter artifacts: snapshotted into the baselines and read by the offline trace.
      - ci/ci-runs/*/checkpoints/iter_*/registry.bin
      - ci/ci-runs/*/*/checkpoints/iter_*/registry.bin
      - ci/ci-runs/*/checkpoints/iter_*/reference.metadata.info
      - ci/ci-runs/*/*/checkpoints/iter_*/reference.metadata.info
      - ci/ci-runs/*/checkpoints/iter_*/*.txt
      - ci/ci-runs/*/*/checkpoints/iter_*/*.txt
      # Raw .metadata pickles — the only survivor if the trace raises before writing.
      - ci/ci-runs/*/checkpoints/iter_*/.metadata
      - ci/ci-runs/*/*/checkpoints/iter_*/.metadata
      # nvrx run-1 reference, parked for an offline cross-run diff on mismatch.
      - ci/ci-runs/*/run1-references/iter_*/reference.metadata.info
      - ci/ci-runs/*/*/run1-references/iter_*/reference.metadata.info
      # In-allocation reference check (>2 nodes): both sides of the manifest diff — the
      # stashed reference-routine manifests and the measured routine's, per checkpoint.
      - ci/ci-runs/*/checkpoints/iter_*/common_pt_dump.info
      - ci/ci-runs/*/*/checkpoints/iter_*/common_pt_dump.info
      - ci/ci-runs/*/phase1-checkpoints/iter_*/reference.metadata.info
      - ci/ci-runs/*/*/phase1-checkpoints/iter_*/reference.metadata.info
      - ci/ci-runs/*/phase1-checkpoints/iter_*/common_pt_dump.info
      - ci/ci-runs/*/*/phase1-checkpoints/iter_*/common_pt_dump.info
      - ci/ci-runs/*/reference-run/*/iter_*/reference.metadata.info
      - ci/ci-runs/*/*/reference-run/*/iter_*/reference.metadata.info
      - ci/ci-runs/*/reference-run/*/iter_*/common_pt_dump.info
      - ci/ci-runs/*/*/reference-run/*/iter_*/common_pt_dump.info
    expire_in: 30 days
    when: always

.baseline_bundle:
  stage: baseline-artifacts
  image: alpine:3.22
  tags: [perflab, type/docker, os/linux]
  retry:
    max: 1
    when: runner_system_failure
  script:
    - mkdir -p .baseline-candidates ci/baselines
    - find ci/ci-runs -type f -path '*/logs/baselines/*' -exec cp -f {} .baseline-candidates/ \; 2>/dev/null || true
    - find ci/baselines -mindepth 1 -maxdepth 1 -type f ! -name platform_bw_mbps.yaml -delete
    - cp -f .baseline-candidates/* ci/baselines/ 2>/dev/null || true
    - ls -la ci/baselines
  artifacts:
    name: "baselines-${PIPELINE_SUITE}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ci/baselines/
    expire_in: 30 days
    when: always

# Optional workload jobs are not started unless the pipeline asks for them.
# A rule's allow_failure replaces the job's own, so setting it here would
# tolerate every failure of a job somebody chose to start, not just the
# perf-drift exit the job allows. Left unset, an unplayed job blocks nothing
# and a played one reports what it did.
.manual_optional:
  rules:
    - if: '$PIPELINE_SUITE == "nvrx" || $PIPELINE_SUITE == "large-scale" || $PIPELINE_SUITE == "main-branch-runs"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$RUN_PIPELINE == "true" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: manual

.nvrx_pipeline:
  rules:
    - if: '$PIPELINE_SUITE == "nvrx"'
      when: on_success
    - when: never

.large_scale_pipeline:
  rules:
    - if: '$PIPELINE_SUITE == "large-scale"'
      when: on_success
    - when: never

.main_branch_runs_pipeline:
  rules:
    - if: '$PIPELINE_SUITE == "main-branch-runs"'
      when: on_success
    - when: never

.pipeline_launcher:
  stage: launch
  image: curlimages/curl:8.15.0
  tags: [perflab, type/docker, os/linux]
  needs:
    - job: wheel:x86_64
      artifacts: true
    - job: wheel:aarch64
      artifacts: true
    - job: wheel-pytest:x86_64
      artifacts: false
    - job: ctest:x86_64
      artifacts: false
    - job: wheel-pytest:aarch64
      artifacts: false
    - job: ctest:aarch64
      artifacts: false
  rules:
    - if: '$PIPELINE_SUITE != "default"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: never
    - if: '$RUN_ALL_SUITES == "true"'
      when: on_success
    - when: manual
      allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - |
      suite_ref="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_REF_NAME}}"
      suite_sha="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-${CI_COMMIT_SHA}}"
      response="$(curl --fail-with-body --silent --show-error --request POST \
        --form "token=${CI_JOB_TOKEN}" \
        --form "ref=${suite_ref}" \
        --form "variables[PIPELINE_SUITE]=${LAUNCH_PIPELINE_SUITE}" \
        --form "variables[UPSTREAM_PIPELINE_SHA]=${suite_sha}" \
        --form "variables[UPSTREAM_PIPELINE_ID]=${CI_PIPELINE_ID}" \
        --form "variables[UPSTREAM_WHEEL_X86_64_JOB_ID]=${UPSTREAM_WHEEL_X86_64_JOB_ID}" \
        --form "variables[UPSTREAM_WHEEL_AARCH64_JOB_ID]=${UPSTREAM_WHEEL_AARCH64_JOB_ID}" \
        --form "variables[MEGATRON_REPO_URL]=${MEGATRON_REPO_URL}" \
        --form "variables[MEGATRON_COMMIT]=${MEGATRON_COMMIT}" \
        --form "variables[NVRX_REPO_URL]=${NVRX_REPO_URL}" \
        --form "variables[NVRX_COMMIT]=${NVRX_COMMIT}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline")"
      printf '%s\n' "${response}" | grep -Eq "\"sha\":[[:space:]]*\"${suite_sha}\""
      pipeline_id="$(printf '%s\n' "${response}" | grep -o '"id":[[:space:]]*[0-9]*' | sed -n '1p' | cut -d: -f2 | tr -d ' ')"
      echo "Launched ${LAUNCH_PIPELINE_SUITE} pipeline ${CI_PROJECT_URL}/-/pipelines/${pipeline_id}"

launch:nvrx-pipeline:
  extends: .pipeline_launcher
  variables:
    LAUNCH_PIPELINE_SUITE: nvrx

launch:large-scale-pipeline:
  extends: .pipeline_launcher
  variables:
    LAUNCH_PIPELINE_SUITE: large-scale

launch:main-branch-runs:
  extends: .pipeline_launcher
  rules:
    - if: '$PIPELINE_SUITE != "default"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$RUN_ALL_SUITES == "true"'
      when: on_success
    - when: manual
      allow_failure: true
  variables:
    LAUNCH_PIPELINE_SUITE: main-branch-runs

# Run updates to open merge requests, but not ordinary branch pushes.
# Explicit web/API runs remain available for pre-MR verification.
workflow:
  rules:
    - if: '$UPSTREAM_PIPELINE_SHA && $UPSTREAM_PIPELINE_SHA != $CI_COMMIT_SHA'
      when: never
    - if: '$PIPELINE_SUITE && $PIPELINE_SUITE != "default" && $PIPELINE_SUITE != "nvrx" && $PIPELINE_SUITE != "large-scale" && $PIPELINE_SUITE != "main-branch-runs"'
      when: never
    - if: '$PIPELINE_SUITE && $PIPELINE_SUITE != "default" && $CI_PIPELINE_SOURCE != "web" && $CI_PIPELINE_SOURCE != "api" && $CI_PIPELINE_SOURCE != "trigger" && $CI_PIPELINE_SOURCE != "pipeline" && $CI_PIPELINE_SOURCE != "parent_pipeline"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $RUN_PIPELINE == "true"'
    - when: never

# ---------------------------------------------------------------------------
# Wheel pipeline (parent-only): build the perf-flavor wheel + dev binaries per
# arch on the shared perflab docker runners, gate it with CTest, pytest, and
# the checkpoint-service stress test on
# the same runners, and publish it for the GPU matrix.
#
# The GB200 pico perf job consumes the aarch64 wheel artifact directly and can
# start as soon as its wheel is built. Publishing remains gated by wheel tests.
# ---------------------------------------------------------------------------

# Per-arch builder image, pushed to the project registry with a buildx layer
# cache. Registry paths stay shallow (image at the project root with arch in
# the tag, cache one subpath deep) so CI_JOB_TOKEN's write scope reaches them.
.wheel_image:
  extends: .default_pipeline
  stage: build
  needs: []
  image: docker:28.4.0
  services:
    - docker:28.4.0-dind
  timeout: 2h
  retry:
    max: 1
    when: runner_system_failure
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker context create wheel-build
    - docker buildx create wheel-build --driver docker-container --use
    - |
      TAG_PREFIX=builder-${WHEEL_ARCH}
      CACHE_REF=$CI_REGISTRY_IMAGE/${TAG_PREFIX}-cache
      docker buildx build --push \
        --cache-to type=registry,ref=${CACHE_REF},mode=max \
        --cache-from type=registry,ref=${CACHE_REF} \
        --provenance=false \
        -f Dockerfile.ci \
        -t ${CI_REGISTRY_IMAGE}:${TAG_PREFIX}-${CI_COMMIT_SHA} \
        -t ${CI_REGISTRY_IMAGE}:${TAG_PREFIX}-latest \
        .

wheel-image:x86_64:
  extends: .wheel_image
  tags: [perflab, type/docker, os/linux]
  variables:
    WHEEL_ARCH: x86_64

wheel-image:aarch64:
  extends: .wheel_image
  tags: [perflab-arm, type/docker, os/linux-arm]
  variables:
    WHEEL_ARCH: aarch64

.wheel_build:
  extends: .default_pipeline
  stage: build
  timeout: 2h
  retry:
    max: 1
    when: runner_system_failure
  variables:
    # The configures install ports per the vcpkg_install() call sites in
    # CMakeLists.txt / cmake/modules — the single source of truth — restored
    # from a binary cache in the project's generic package registry
    # (cmake/vcpkg.cmake forwards an externally set VCPKG_BINARY_SOURCES).
    # A port missing from the cache (new port, or a key rotated by a
    # toolchain/vcpkg bump) is compiled in-job once and uploaded; the 2h
    # timeout absorbs that cold build.
    VCPKG_BINARY_SOURCES: "clear;http,${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vcpkg-cache/{triplet}/{name}-{sha}.zip,readwrite,JOB-TOKEN: ${CI_JOB_TOKEN}"
  artifacts:
    when: always
    paths:
      - dist/*.whl
      - dist/*.txt
      - dev_binaries/
    reports:
      dotenv: wheel-job.env
    expire_in: 30 days
  script:
    - |
      cmake -B build-wheel -S . -G Ninja \
        -DCMAKE_BUILD_TYPE=RelWithDebInfo \
        -DPython3_EXECUTABLE=/opt/venv/bin/python \
        -DPHOENIX_BUILD_WHEEL=ON \
        -DPHOENIX_WHEEL_VERSION="0.0.1.dev${CI_PIPELINE_IID}+g${CI_COMMIT_SHORT_SHA}" \
        -DPHOENIX_REQUIRE_CUDA=ON \
        -DPHOENIX_BUILD_BENCHMARK=OFF \
        -DPHOENIX_BUILD_TESTS=OFF \
        -DBUILDENV_DISABLE_MARCH_NATIVE=ON
    - cmake --build build-wheel -j"$(nproc)" --target nvrx_checkpointing_whl
    - |
      cmake -B build-dev -S . -G Ninja \
        -DCMAKE_BUILD_TYPE=RelWithDebInfo \
        -DPython3_EXECUTABLE=/opt/venv/bin/python \
        -DPHOENIX_BUILD_WHEEL=OFF \
        -DPHOENIX_BUILD_BENCHMARK=OFF \
        -DPHOENIX_BUILD_TESTS=ON \
        -DPHOENIX_BUILD_CUDA=OFF \
        -DBUILDENV_DISABLE_MARCH_NATIVE=ON
    - cmake --build build-dev -j"$(nproc)" --target ckpttest _distcp_shim
    - mkdir -p dist dev_binaries
    - cp build-wheel/*-abi3-*.whl dist/
    - find dist -maxdepth 1 -type f -name "*-linux_${WHEEL_ARCH}.whl" -printf '%f\n' > "dist/nvrx_checkpointing-linux_${WHEEL_ARCH}.txt"
    - cp build-dev/ckpttest build-dev/_distcp_shim*.so dev_binaries/
    - printf '%s=%s\n' "${WHEEL_JOB_ID_VARIABLE}" "${CI_JOB_ID}" > wheel-job.env
    - ls -la dist/ dev_binaries/

wheel:x86_64:
  extends: .wheel_build
  needs: [wheel-image:x86_64]
  image: $CI_REGISTRY_IMAGE:builder-x86_64-$CI_COMMIT_SHA
  tags: [perflab, type/docker, os/linux]
  variables:
    WHEEL_ARCH: x86_64
    WHEEL_JOB_ID_VARIABLE: UPSTREAM_WHEEL_X86_64_JOB_ID

wheel:aarch64:
  extends: .wheel_build
  needs: [wheel-image:aarch64]
  image: $CI_REGISTRY_IMAGE:builder-aarch64-$CI_COMMIT_SHA
  tags: [perflab-arm, type/docker, os/linux-arm]
  variables:
    WHEEL_ARCH: aarch64
    WHEEL_JOB_ID_VARIABLE: UPSTREAM_WHEEL_AARCH64_JOB_ID

# Install the wheel with pip exactly as consumers do, then run the pytest
# suite and Catch2 binary built by the wheel job, matching the main branch.
.wheel_pytest:
  extends: .default_pipeline
  stage: test
  timeout: 30m
  artifacts:
    when: always
    paths:
      - ci/ci-results/pytest.xml
    reports:
      junit: ci/ci-results/pytest.xml
    expire_in: 30 days
  script:
    - /opt/venv/bin/python ci/scripts/wheel_install.py --from-dist dist
    - mkdir -p ci/ci-results
    - export PYTHONPATH="${CI_PROJECT_DIR}/dev_binaries"
    - /opt/venv/bin/python -m pip show nvrx_checkpointing
    - /opt/venv/bin/python -c "import nvrx_checkpointing as m; print(m.SHLIB_PATH, m.SERVER_PATH)"
    - /opt/venv/bin/python -m nvrx_checkpointing.metadata_compare --help >/dev/null
    - /opt/venv/bin/python -m pytest tests -v --junitxml=ci/ci-results/pytest.xml
    - chmod +x dev_binaries/ckpttest
    - ./dev_binaries/ckpttest

wheel-pytest:x86_64:
  extends: .wheel_pytest
  needs: [wheel-image:x86_64, wheel:x86_64]
  image: $CI_REGISTRY_IMAGE:builder-x86_64-$CI_COMMIT_SHA
  tags: [perflab, type/docker, os/linux]
  variables:
    WHEEL_ARCH: x86_64

wheel-pytest:aarch64:
  extends: .wheel_pytest
  needs: [wheel-image:aarch64, wheel:aarch64]
  image: $CI_REGISTRY_IMAGE:builder-aarch64-$CI_COMMIT_SHA
  tags: [perflab-arm, type/docker, os/linux-arm]
  variables:
    WHEEL_ARCH: aarch64

# Keep CMake's test discovery and the checkpoint-service stress gate isolated
# from the consumer-style wheel tests. Using pip for CMake's unpinned torch
# request lets the image's system PyTorch satisfy it without installing a
# conflicting CPU wheel into /opt/venv.
.ctest:
  extends: .default_pipeline
  stage: test
  timeout: 2h
  variables:
    VCPKG_BINARY_SOURCES: "clear;http,${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vcpkg-cache/{triplet}/{name}-{sha}.zip,readwrite,JOB-TOKEN: ${CI_JOB_TOKEN}"
  artifacts:
    when: always
    paths:
      - ci/ci-results/ctest.xml
      - ci/ci-results/*.log
    reports:
      junit: ci/ci-results/ctest.xml
    expire_in: 30 days
  script:
    - /opt/venv/bin/python ci/scripts/wheel_install.py --from-dist dist
    - |
      cmake -B build-test -S . -G Ninja \
        -DCMAKE_BUILD_TYPE=RelWithDebInfo \
        -DPython3_EXECUTABLE=/opt/venv/bin/python \
        -DUV_EXECUTABLE=/nonexistent/uv \
        -DPHOENIX_BUILD_WHEEL=OFF \
        -DPHOENIX_BUILD_BENCHMARK=ON \
        -DPHOENIX_BUILD_TESTS=ON \
        -DPHOENIX_BUILD_CUDA=OFF \
        -DBUILDENV_DISABLE_MARCH_NATIVE=ON
    - cmake --build build-test -j"$(nproc)" --target ckpttest _distcp_shim ckpt_stress_test dcp_load distcp_roundtrip
    - mkdir -p ci/ci-results
    - export MEGATRON_NATIVE_BUILD_DIR="${CI_PROJECT_DIR}/build-test"
    - export PYTHONPATH="${CI_PROJECT_DIR}/build-test"
    - /opt/venv/bin/python -c "import torch; print(torch.__version__, torch.__file__)"
    - ctest --test-dir build-test --output-on-failure --output-junit "${CI_PROJECT_DIR}/ci/ci-results/ctest.xml"
    - /opt/venv/bin/python ci/scripts/ckpt_stress.py --gpus-per-node 2

ctest:x86_64:
  extends: .ctest
  needs: [wheel-image:x86_64, wheel:x86_64]
  image: $CI_REGISTRY_IMAGE:builder-x86_64-$CI_COMMIT_SHA
  tags: [perflab, type/docker, os/linux]
  variables:
    WHEEL_ARCH: x86_64

ctest:aarch64:
  extends: .ctest
  needs: [wheel-image:aarch64, wheel:aarch64]
  image: $CI_REGISTRY_IMAGE:builder-aarch64-$CI_COMMIT_SHA
  tags: [perflab-arm, type/docker, os/linux-arm]
  variables:
    WHEEL_ARCH: aarch64

# Publish main's tested wheels to the project PyPI registry.
.wheel_publish:
  extends: .default_pipeline
  stage: test
  timeout: 15m
  rules:
    - if: '$PIPELINE_SUITE != "default"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  script:
    - |
      export TWINE_USERNAME=gitlab-ci-token
      export TWINE_PASSWORD="${CI_JOB_TOKEN}"
      /opt/venv/bin/python -m twine check dist/*.whl
      /opt/venv/bin/python -m twine upload \
        --non-interactive \
        --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" \
        dist/*.whl

wheel-publish:pypi:
  extends: .wheel_publish
  needs:
    - job: wheel:x86_64
      artifacts: true
    - job: wheel:aarch64
      artifacts: true
    - job: wheel-pytest:x86_64
      artifacts: false
    - job: wheel-pytest:aarch64
      artifacts: false
    - job: ctest:x86_64
      artifacts: false
    - job: ctest:aarch64
      artifacts: false
  image: $CI_REGISTRY_IMAGE:builder-x86_64-$CI_COMMIT_SHA
  tags: [perflab, type/docker, os/linux]

