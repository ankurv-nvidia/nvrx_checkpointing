# GitLab CI for performance and correctness testing.
#
# Include from root .gitlab-ci.yml:
#   include:
#     - megatron/native/ci/gitlab-ci-native.yml
#
# Runners must be registered on each machine's login node.
# See megatron/native/ci/runner/setup_runner.py and ci/prepare.md.

# `build` and `test` are shared with the root pipeline this file is included
# into; reusing their names keeps prepare-image ordered before the test jobs
# after GitLab merges the stage lists (include-only stages get appended last,
# which would push a dedicated prepare stage after test and break the needs:).
stages:
  - build
  - test
  - update

# ---------------------------------------------------------------------------
# Base template: shared settings for all jobs
# ---------------------------------------------------------------------------
.ci_base:
  interruptible: false
  retry:
    max: 1
    when: runner_system_failure
  variables:
    CI_SCRIPTS_DIR: "${CI_PROJECT_DIR}/megatron/native/ci/scripts"
    BASELINES_DIR: "${CI_PROJECT_DIR}/megatron/native/ci/baselines"
    RESULTS_DIR: "${CI_PROJECT_DIR}/megatron/native/ci/ci-results"
    METADATA_DIR: "${CI_PROJECT_DIR}/megatron/native/metadata"
  before_script:
    - echo "=== Pipeline ${CI_PIPELINE_ID} | Job ${CI_JOB_ID} | Commit ${CI_COMMIT_SHORT_SHA} ==="
    - echo "=== Running on $(hostname) ==="
    # Source the cluster config (CLUSTER + env vars like VCPKG_ROOT). CLUSTER is the
    # machine tag run_job.py uses to namespace baselines; setup_runner forwards it into
    # the runner env. Export it here too (with a devbox fallback) so it reaches run_job
    # on local/unconfigured runs.
    - source ~/data/ci/config 2>/dev/null || source ~/data/ci 2>/dev/null || true
    - export CLUSTER="${CLUSTER:-devbox}"
    - echo "=== CLUSTER=${CLUSTER} ==="

# ---------------------------------------------------------------------------
# Per-runner templates: just the GitLab tag that routes jobs to each runner.
#
# Nothing cluster-specific is set here — GPUs-per-node, SLURM/inline mode and the
# machine tag are all configured per cluster at runner setup and forwarded into
# the runner environment (GPUS_PER_NODE, SLURM_PARTITION, CLUSTER; see setup_runner.py).
# run_job.py honors them, so the same JOB_ARGS run on any cluster — no
# --gpus-per-node and no --slurm flag in the YAML.
# ---------------------------------------------------------------------------
.runner_gb200:
  tags: [gb200]

.runner_h200:
  tags: [h200]

.runner_devbox:
  tags: [devbox]

# ---------------------------------------------------------------------------
# Template: run a job via run_job.py (JOB_ARGS set by each concrete job)
# ---------------------------------------------------------------------------
.run_job:
  extends: .ci_base
  stage: test
  timeout: 4h
  # exit 3 = perf regression — pipeline continues so update jobs remain triggerable.
  # exit 2 = job crashed — treated as a real failure (pipeline goes red).
  allow_failure:
    exit_codes: [3]
  script:
    - python3 "${CI_SCRIPTS_DIR}/run_job.py" ${JOB_ARGS} || exit $?
  after_script:
    - du -h megatron/native/ci/ci-runs/*/checkpoints/iter_*/*.distcp 2>/dev/null || true
  artifacts:
    paths:
      - megatron/native/ci/ci-results/*.log
      - megatron/native/ci/ci-results/*_report.json
      # Per-iter outputs the update stage mirrors into megatron/native/metadata/:
      # pretrain-native contributes registry.bin / [0-9]*.metadata.info / *.txt,
      # both providers contribute reference.metadata.info (re-derived by the
      # in-job _compare_iters_to_baseline → distcp_trace pass).
      - megatron/native/ci/ci-runs/*/checkpoints/iter_*/registry.bin
      - megatron/native/ci/ci-runs/*/checkpoints/iter_*/[0-9]*.metadata.info
      - megatron/native/ci/ci-runs/*/checkpoints/iter_*/reference.metadata.info
      - megatron/native/ci/ci-runs/*/checkpoints/iter_*/*.txt
      # Raw .metadata pickles — what dcp.load and distcp_trace actually read.
      # On a contiguity-check failure, distcp_trace raises before writing
      # reference.metadata.info, so this is the only artifact that survives
      # for offline analysis of the storage_data layout.
      - megatron/native/ci/ci-runs/*/checkpoints/iter_*/.metadata
      # pretrain-nvrx determinism check: run-1's reference.metadata.info is
      # parked here before run-2 starts. On a cross-run mismatch the diff is
      # reproducible offline as `diff run1-references/iter_*/reference.metadata.info
      # checkpoints/iter_*/reference.metadata.info`.
      - megatron/native/ci/ci-runs/*/run1-references/iter_*/reference.metadata.info
    expire_in: 30 days
    when: always

# Optional manual: job is always present in the pipeline but never runs
# automatically — only when a user clicks "play" in the GitLab UI. Use for
# jobs that are useful on demand (e.g. cross-provider baseline checks) but
# too expensive or noisy to run on every commit.
.manual_optional:
  rules:
    - when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# Build the enroot squash image once, up front, in the build stage.
#
# `prepare_image.py` builds the .sqsh if it is missing and is a fast no-op when
# it already exists (and a no-op on inline/devbox runners, which use no image).
# One job per runner; every test job `needs:` its own runner's prepare-image job
# (see the .needs_*_image mixins) so jobs no longer build or stall on the image
# inside the workload itself, and clusters don't wait on each other.
# ---------------------------------------------------------------------------
.prepare_image:
  extends: .ci_base
  stage: build
  timeout: 2h
  script:
    - python3 "${CI_SCRIPTS_DIR}/prepare_image.py"

gb200:prepare-image:
  extends: [.prepare_image, .runner_gb200]

h200:prepare-image:
  extends: [.prepare_image, .runner_h200]

devbox:prepare-image:
  extends: [.prepare_image, .runner_devbox]

# Each test job depends only on its own runner's prepare-image job (DAG via
# needs), so it starts as soon as that image is ready without waiting on the
# other clusters' prepare jobs. artifacts:false — the image lives on shared
# storage, not in CI artifacts.
.needs_gb200_image:
  needs:
    - job: gb200:prepare-image
      artifacts: false
.needs_h200_image:
  needs:
    - job: h200:prepare-image
      artifacts: false
.needs_devbox_image:
  needs:
    - job: devbox:prepare-image
      artifacts: false

# ---------------------------------------------------------------------------
# Stage: test
# ---------------------------------------------------------------------------
gb200:ckptbench:1x4:
  extends: [.run_job, .runner_gb200, .needs_gb200_image]
  variables:
    JOB_ARGS: "ckptbench"

h200:ckptbench:1x8:
  extends: [.run_job, .runner_h200, .needs_h200_image]
  variables:
    JOB_ARGS: "ckptbench"

devbox:ckptbench:1x2:
  extends: [.run_job, .runner_devbox, .needs_devbox_image]
  variables:
    JOB_ARGS: "ckptbench"

# pretrain-native: perf measurement (default flavor) and deterministic validation
# (cross-provider md5 vs the nvrx baseline in metadata/) run as separate jobs so
# perf isn't skewed by --deterministic-mode and each keeps its own baseline.
gb200:pretrain-native:1x4:perf:
  extends: [.run_job, .runner_gb200, .needs_gb200_image]
  variables:
    JOB_ARGS: "pretrain-native --flavor perf"

h200:pretrain-native:1x8:perf:
  extends: [.run_job, .runner_h200, .needs_h200_image]
  variables:
    JOB_ARGS: "pretrain-native --flavor perf"

devbox:pretrain-native:1x2:perf:
  extends: [.run_job, .runner_devbox, .needs_devbox_image]
  variables:
    JOB_ARGS: "pretrain-native --flavor perf"

gb200:pretrain-native:1x4:deterministic:
  extends: [.run_job, .runner_gb200, .needs_gb200_image]
  variables:
    JOB_ARGS: "pretrain-native --flavor deterministic"

h200:pretrain-native:1x8:deterministic:
  extends: [.run_job, .runner_h200, .needs_h200_image]
  variables:
    JOB_ARGS: "pretrain-native --flavor deterministic"

devbox:pretrain-native:1x2:deterministic:
  extends: [.run_job, .runner_devbox, .needs_devbox_image]
  variables:
    JOB_ARGS: "pretrain-native --flavor deterministic"

# pretrain-nvrx: cross-run determinism gate (requires the deterministic flavor).
gb200:pretrain-nvrx:1x4:deterministic:
  extends: [.run_job, .runner_gb200, .manual_optional, .needs_gb200_image]
  variables:
    JOB_ARGS: "pretrain-nvrx --flavor deterministic"

h200:pretrain-nvrx:1x8:deterministic:
  extends: [.run_job, .runner_h200, .manual_optional, .needs_h200_image]
  variables:
    JOB_ARGS: "pretrain-nvrx --flavor deterministic"

devbox:pretrain-nvrx:1x2:deterministic:
  extends: [.run_job, .runner_devbox, .manual_optional, .needs_devbox_image]
  variables:
    JOB_ARGS: "pretrain-nvrx --flavor deterministic"

# 16-node perf scale runs: clusters only, manual trigger.
gb200:pretrain:16x4:perf:
  extends: [.run_job, .runner_gb200, .manual_optional, .needs_gb200_image]
  variables:
    JOB_ARGS: "pretrain-native --nodes 16 --flavor perf"

h200:pretrain:16x8:perf:
  extends: [.run_job, .runner_h200, .manual_optional, .needs_h200_image]
  variables:
    JOB_ARGS: "pretrain-native --nodes 16 --flavor perf"

# Valgrind: memcheck the checkpoint_server under the deterministic flavor (the
# numerics CI normally validates). valgrind slows the server ~10-50x, so metrics
# are informational (no valgrind baseline). Devbox runs locally (no srun) —
# valgrind must be installed on the runner host.
gb200:valgrind:1x4:
  extends: [.run_job, .runner_gb200, .needs_gb200_image]
  variables:
    JOB_ARGS: "pretrain-native --flavor deterministic --flavor valgrind"

h200:valgrind:1x8:
  extends: [.run_job, .runner_h200, .needs_h200_image]
  variables:
    JOB_ARGS: "pretrain-native --flavor deterministic --flavor valgrind"

devbox:valgrind:1x2:
  extends: [.run_job, .runner_devbox, .needs_devbox_image]
  variables:
    JOB_ARGS: "pretrain-native --flavor deterministic --flavor valgrind"

# ---------------------------------------------------------------------------
# Stage: update — update baselines from report files produced by test stage.
#
# No benchmarks are re-run. Each update job uses `needs:` (DAG mode) so it
# becomes playable as soon as its single matching test job completes, without
# waiting for the rest of the test stage. `needs:` also implicitly downloads
# artifacts from the listed job — so we only see that job's artifacts, which
# avoids one runner committing metadata files produced by another cluster's
# test run. Triggerable even when the test job failed with exit 3 (perf
# regression) because artifacts use `when: always` and the upstream is
# `allow_failure`.
# ---------------------------------------------------------------------------
.update_baseline_base:
  extends: .ci_base
  stage: update
  timeout: 4h
  when: manual
  allow_failure: true
  script:
    - |
      git config user.email "ci-bot@noreply"
      git config user.name  "CI Baseline Bot"
      git remote set-url origin "ssh://git@${CI_SERVER_HOST}:12051/${CI_PROJECT_PATH}.git"
      git pull --rebase origin "${CI_COMMIT_BRANCH}"
    - python3 "${CI_SCRIPTS_DIR}/run_job.py" update_baselines
    - |
      mkdir -p "${BASELINES_DIR}"
      git add "${BASELINES_DIR}/"
      # pretrain-native update_baselines refreshes registry.bin / [0-9]*.metadata.info
      # and pretrain-nvrx update_baselines refreshes reference.metadata.info under
      # megatron/native/metadata/; harmless for ckptbench (no diff there).
      if [ -d "${METADATA_DIR}" ]; then
        git add "${METADATA_DIR}/"
      fi
      if git diff --cached --quiet; then
        echo "No baseline changes - nothing to commit."
      else
        git commit -m "ci: update performance baselines [skip ci] | Pipeline: ${CI_PIPELINE_ID} | Commit: ${CI_COMMIT_SHORT_SHA} | Branch: ${CI_COMMIT_BRANCH}"
        git push origin "HEAD:${CI_COMMIT_BRANCH}"
      fi

gb200:ckptbench:1x4:update_baselines:
  extends: [.update_baseline_base, .runner_gb200]
  needs:
    - job: gb200:ckptbench:1x4
      artifacts: true

h200:ckptbench:1x8:update_baselines:
  extends: [.update_baseline_base, .runner_h200]
  needs:
    - job: h200:ckptbench:1x8
      artifacts: true

devbox:ckptbench:1x2:update_baselines:
  extends: [.update_baseline_base, .runner_devbox]
  needs:
    - job: devbox:ckptbench:1x2
      artifacts: true

gb200:pretrain-native:1x4:perf:update_baselines:
  extends: [.update_baseline_base, .runner_gb200]
  needs:
    - job: gb200:pretrain-native:1x4:perf
      artifacts: true

h200:pretrain-native:1x8:perf:update_baselines:
  extends: [.update_baseline_base, .runner_h200]
  needs:
    - job: h200:pretrain-native:1x8:perf
      artifacts: true

devbox:pretrain-native:1x2:perf:update_baselines:
  extends: [.update_baseline_base, .runner_devbox]
  needs:
    - job: devbox:pretrain-native:1x2:perf
      artifacts: true

gb200:pretrain-native:1x4:deterministic:update_baselines:
  extends: [.update_baseline_base, .runner_gb200]
  needs:
    - job: gb200:pretrain-native:1x4:deterministic
      artifacts: true

h200:pretrain-native:1x8:deterministic:update_baselines:
  extends: [.update_baseline_base, .runner_h200]
  needs:
    - job: h200:pretrain-native:1x8:deterministic
      artifacts: true

devbox:pretrain-native:1x2:deterministic:update_baselines:
  extends: [.update_baseline_base, .runner_devbox]
  needs:
    - job: devbox:pretrain-native:1x2:deterministic
      artifacts: true

gb200:pretrain-nvrx:1x4:deterministic:update_baselines:
  extends: [.update_baseline_base, .runner_gb200]
  needs:
    - job: gb200:pretrain-nvrx:1x4:deterministic
      artifacts: true

h200:pretrain-nvrx:1x8:deterministic:update_baselines:
  extends: [.update_baseline_base, .runner_h200]
  needs:
    - job: h200:pretrain-nvrx:1x8:deterministic
      artifacts: true

devbox:pretrain-nvrx:1x2:deterministic:update_baselines:
  extends: [.update_baseline_base, .runner_devbox]
  needs:
    - job: devbox:pretrain-nvrx:1x2:deterministic
      artifacts: true
