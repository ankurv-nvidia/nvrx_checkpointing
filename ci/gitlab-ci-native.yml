# Multinode nvrx: generates the cross-provider baseline (metadata/2x4_*) the 2x4
# native deterministic job compares against. Baselines are namespaced by config,
# so these do not collide with the 1x4 set.
15.gb200:pretrain-nvrx:2x4:deterministic:
  extends: [.run_job, .runner_gb200, .needs_gb200_image, .manual_optional]
