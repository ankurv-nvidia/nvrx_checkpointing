# GitLab CI for performance and correctness testing.
#
# Include from root .gitlab-ci.yml:
#   include:
#     - megatron/native/ci/gitlab-ci-native.yml
#
# Runners must be registered on each machine's login node.
# See megatron/native/ci/runner/setup_runner.py and ci/prepare.md.

# `build` and `test` are shared with the root pipeline this file is included
# into; reusing their names keeps prepare-image ordered before the test jobs
# after GitLab merges the stage lists (include-only stages get appended last,
# which would push a dedicated prepare stage after test and break the needs:).
stages:
  - build
  - test
  - update

# ---------------------------------------------------------------------------
# Base template: shared settings for all jobs
# ---------------------------------------------------------------------------
.ci_base:
  interruptible: false
  retry:
    max: 1
    when: runner_system_failure
  variables:
    CI_SCRIPTS_DIR: "${CI_PROJECT_DIR}/megatron/native/ci/scripts"
    BASELINES_DIR: "${CI_PROJECT_DIR}/megatron/native/ci/baselines"
    RESULTS_DIR: "${CI_PROJECT_DIR}/megatron/native/ci/ci-results"
    METADATA_DIR: "${CI_PROJECT_DIR}/megatron/native/metadata"
  before_script:
    - echo "=== Pipeline ${CI_PIPELINE_ID} | Job ${CI_JOB_ID} | Commit ${CI_COMMIT_SHORT_SHA} ==="
    - echo "=== Running on $(hostname) ==="
    # Source the runner config (PLATFORM/CLUSTER + env vars like VCPKG_ROOT) and export
    # both for run_job.py. PLATFORM (gb200/h100/...) is the GitLab tag + baseline namespace;
    # CLUSTER (cwdfw/ocihsg/...) selects the srun templates. setup_runner forwards both into
    # the runner env; re-export here (with fallbacks) so they reach run_job on local runs.
    # PLATFORM falls back to CLUSTER for configs predating the split, CLUSTER to devbox.
    - source ~/data/ci/config 2>/dev/null || source ~/data/ci 2>/dev/null || true
    - export CLUSTER="${CLUSTER:-devbox}"
    - export PLATFORM="${PLATFORM:-${CLUSTER}}"
    - echo "=== PLATFORM=${PLATFORM} CLUSTER=${CLUSTER} ==="

# ---------------------------------------------------------------------------
# Per-runner templates: just the GitLab tag (the PLATFORM) that routes jobs.
#
# Nothing cluster-specific is set here — GPUs-per-node, SLURM/inline mode, PLATFORM and
# CLUSTER are all configured per runner at setup and forwarded into the runner
# environment (GPUS_PER_NODE, SLURM_PARTITION, PLATFORM, CLUSTER; see setup_runner.py).
# PLATFORM (gb200/h100/...) is the runner tag + baseline namespace; CLUSTER (cwdfw/...)
# selects the srun templates. run_job.py honors them, so the same JOB_ARGS run on any
# cluster — no --gpus-per-node and no --slurm flag in the YAML.
# ---------------------------------------------------------------------------
.runner_gb200:
  tags: [gb200]

.runner_h100:
  tags: [h100]

.runner_devbox:
  tags: [devbox]

# ---------------------------------------------------------------------------
# Template: run a job via run_job.py (JOB_ARGS set by each concrete job)
# ---------------------------------------------------------------------------
.run_job:
  extends: .ci_base
  stage: test
  timeout: 4h
  # exit 3 = perf regression — pipeline continues so update jobs remain triggerable.
  # exit 2 = job crashed — treated as a real failure (pipeline goes red).
  allow_failure:
    exit_codes: [3]
  script:
    - python3 "${CI_SCRIPTS_DIR}/run_job.py" ${JOB_ARGS} || exit $?
  after_script:
    - du -h megatron/native/ci/ci-runs/*/checkpoints/iter_*/*.distcp 2>/dev/null || true
  artifacts:
    paths:
      - megatron/native/ci/ci-results/*.log
      - megatron/native/ci/ci-results/*_report.json
      # Per-iter outputs the update stage mirrors into megatron/native/metadata/:
      # pretrain-native contributes registry.bin / [0-9]*.metadata.info / *.txt,
      # both providers contribute reference.metadata.info (re-derived by the
      # in-job _compare_iters_to_baseline → distcp_trace pass).
      - megatron/native/ci/ci-runs/*/checkpoints/iter_*/registry.bin
      - megatron/native/ci/ci-runs/*/checkpoints/iter_*/[0-9]*.metadata.info
      - megatron/native/ci/ci-runs/*/checkpoints/iter_*/reference.metadata.info
      - megatron/native/ci/ci-runs/*/checkpoints/iter_*/*.txt
      # Raw .metadata pickles — what dcp.load and distcp_trace actually read.
      # On a contiguity-check failure, distcp_trace raises before writing
      # reference.metadata.info, so this is the only artifact that survives
      # for offline analysis of the storage_data layout.
      - megatron/native/ci/ci-runs/*/checkpoints/iter_*/.metadata
      # pretrain-nvrx determinism check: run-1's reference.metadata.info is
      # parked here before run-2 starts. On a cross-run mismatch the diff is
      # reproducible offline as `diff run1-references/iter_*/reference.metadata.info
      # checkpoints/iter_*/reference.metadata.info`.
      - megatron/native/ci/ci-runs/*/run1-references/iter_*/reference.metadata.info
    expire_in: 30 days
    when: always

# ckptbench has its own entry script (ckptbench.py); everything else in .run_job
# (stage, timeout, allow_failure exit 3, artifacts, after_script) is reused.
.run_ckptbench:
  extends: .run_job
  script:
    - python3 "${CI_SCRIPTS_DIR}/ckptbench.py" || exit $?

# Optional manual: job is always present in the pipeline but never runs
# automatically — only when a user clicks "play" in the GitLab UI. Use for
# jobs that are useful on demand (e.g. cross-provider baseline checks) but
# too expensive or noisy to run on every commit.
.manual_optional:
  when: manual
  allow_failure: true

# ---------------------------------------------------------------------------
# Build the enroot squash image once, up front, in the build stage.
#
# `prepare_image.py` builds the .sqsh if it is missing and is a fast no-op when
# it already exists (and a no-op on inline/devbox runners, which use no image).
# One job per runner; every test job `needs:` its own runner's prepare-image job
# (see the .needs_*_image mixins) so jobs no longer build or stall on the image
# inside the workload itself, and clusters don't wait on each other.
# ---------------------------------------------------------------------------
.prepare_image:
  extends: .ci_base
  stage: build
  timeout: 2h
  script:
    - python3 "${CI_SCRIPTS_DIR}/prepare_image.py"

gb200:prepare-image:
  extends: [.prepare_image, .runner_gb200]

h100:prepare-image:
  extends: [.prepare_image, .runner_h100]

# Each test job depends only on its own runner's prepare-image job (DAG via
# needs), so it starts as soon as that image is ready without waiting on the
# other clusters' prepare jobs. artifacts:false — the image lives on shared
# storage, not in CI artifacts.
.needs_gb200_image:
  needs:
    - job: gb200:prepare-image
      artifacts: false
.needs_h100_image:
  needs:
    - job: h100:prepare-image
      artifacts: false

.update_baseline_base:
  extends: .ci_base
  stage: update
  timeout: 4h
  when: manual
  allow_failure: true
  script:
    - |
      git config user.email "ci-bot@noreply"
      git config user.name  "CI Baseline Bot"
      git remote set-url origin "ssh://git@${CI_SERVER_HOST}:12051/${CI_PROJECT_PATH}.git"
      git pull --rebase origin "${CI_COMMIT_BRANCH}"
    - python3 "${CI_SCRIPTS_DIR}/run_job.py" update_baselines
    - |
      mkdir -p "${BASELINES_DIR}"
      git add "${BASELINES_DIR}/"
      # pretrain-native update_baselines refreshes registry.bin / [0-9]*.metadata.info
      # and pretrain-nvrx update_baselines refreshes reference.metadata.info under
      # megatron/native/metadata/; harmless for ckptbench (no diff there).
      if [ -d "${METADATA_DIR}" ]; then
        git add "${METADATA_DIR}/"
      fi
      if git diff --cached --quiet; then
        echo "No baseline changes - nothing to commit."
      else
        git commit -m "ci: update performance baselines [skip ci] | Pipeline: ${CI_PIPELINE_ID} | Commit: ${CI_COMMIT_SHORT_SHA} | Branch: ${CI_COMMIT_BRANCH}"
        git push origin "HEAD:${CI_COMMIT_BRANCH}"
      fi

00.devbox:ckptbench:1x2:
  extends: [.run_ckptbench, .runner_devbox]

00.devbox:ckptbench:1x2:update_baselines:
  extends: [.update_baseline_base, .runner_devbox]
  needs:
    - job: 00.devbox:ckptbench:1x2
      artifacts: true

01.devbox:pretrain-native:1x2:deterministic:
  extends: [.run_job, .runner_devbox]
  variables:
    JOB_ARGS: "pretrain-native --flavor deterministic"

01.devbox:pretrain-native:1x2:deterministic:update_baselines:
  extends: [.update_baseline_base, .runner_devbox]
  needs:
    - job: 01.devbox:pretrain-native:1x2:deterministic
      artifacts: true

02.devbox:pretrain-native:1x2:perf:
  extends: [.run_job, .runner_devbox]
  variables:
    JOB_ARGS: "pretrain-native --flavor perf"

02.devbox:pretrain-native:1x2:perf:update_baselines:
  extends: [.update_baseline_base, .runner_devbox]
  needs:
    - job: 02.devbox:pretrain-native:1x2:perf
      artifacts: true

03.devbox:pretrain-nvrx:1x2:deterministic:
  extends: [.run_job, .runner_devbox, .manual_optional]
  variables:
    JOB_ARGS: "pretrain-nvrx --flavor deterministic"

03.devbox:pretrain-nvrx:1x2:deterministic:update_baselines:
  extends: [.update_baseline_base, .runner_devbox]
  needs:
    - job: 03.devbox:pretrain-nvrx:1x2:deterministic
      artifacts: true

zy.devbox:valgrind:1x2:
  extends: [.run_job, .runner_devbox, .manual_optional]
  # Override .manual_optional's allow_failure:true: a memcheck error or a stall
  # (exit != 3) must fail the pipeline, not show as an allowed warning. Only the
  # perf soft-fail (exit 3) stays tolerated, matching .run_job.
  allow_failure:
    exit_codes: [3]
  variables:
    JOB_ARGS: "pretrain-native --flavor deterministic --flavor valgrind"

10.gb200:ckptbench:1x4:
  extends: [.run_ckptbench, .runner_gb200, .needs_gb200_image]

10.gb200:ckptbench:1x4:update_baselines:
  extends: [.update_baseline_base, .runner_gb200]
  needs:
    - job: 10.gb200:ckptbench:1x4
      artifacts: true

11.gb200:pretrain-native:1x4:deterministic:
