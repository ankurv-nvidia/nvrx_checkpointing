  variables:
    JOB_ARGS: "pretrain-native --flavor deterministic"

11.gb200:pretrain-native:1x4:deterministic:update_baselines:
  extends: [.update_baseline_base, .runner_gb200]
  needs:
    - job: 11.gb200:pretrain-native:1x4:deterministic
