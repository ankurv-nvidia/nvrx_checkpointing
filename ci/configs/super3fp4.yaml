# NVFP4 precision profile for the shared Super3 architecture.
inherits: super3

# NVFP4 precision. The --bf16 base flag remains the model's storage precision.
# The reference script's newer --keep-* controls are not used here; the
# supported first/last BF16 boundary is in super3.yaml.
fp4-format: e2m1
fp4-recipe: nvfp4

# Keep optimizer state in BF16 so the 88-layer model retains additional HBM
# headroom for fused cross-entropy and MTP temporaries on GB200 GPUs.
use-precision-aware-optimizer: true
main-grads-dtype: bf16
exp-avg-dtype: bf16
exp-avg-sq-dtype: bf16
grad-reduce-in-bf16: true

# Mamba capture faults on replay, while adding MoE-router capture consumes too
# much HBM. Attention-only capture has completed both training phases and
# checkpoint rollover while preserving useful headroom.
cuda-graph-impl: local
cuda-graph-modules: [attn]
