# NVFP4 precision profile for the shared Super3 architecture.
inherits: super3

# NVFP4 precision. The --bf16 base flag remains the model's storage precision.
# The reference script's newer --keep-* controls are not present in pinned
# Megatron 77c87725; the supported first/last BF16 boundary is in super3.yaml.
fp4-format: e2m1
fp4-recipe: nvfp4

# Keep optimizer state in BF16 so the 88-layer model retains enough HBM for
# the 3.91 GiB fused cross-entropy temporary on 184 GiB GB200 GPUs.
use-precision-aware-optimizer: true
main-grads-dtype: bf16
exp-avg-dtype: bf16
exp-avg-sq-dtype: bf16
grad-reduce-in-bf16: true

# Mamba capture faults on replay, while adding MoE-router capture leaves too
# little HBM for the 3.91 GiB MTP loss temporary. Attention-only capture has
# completed both training phases and checkpoint rollover with ample headroom.
cuda-graph-impl: local
cuda-graph-modules: [attn]
