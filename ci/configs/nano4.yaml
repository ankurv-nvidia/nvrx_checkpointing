# Nano4 30B latent-MoE GDP-hybrid architecture from the supplied
# a3b_30b_moe_1t.sh production recipe. The CI harness intentionally substitutes
# mock data and owns checkpoint paths, providers, cadence, and finite run length;
# the model, optimizer, parallelism, and performance-sensitive training options
# remain aligned with the reference recipe.

# Unified main/MTP layout. The segments after the slashes describe the two MTP
# layers, as in the production invocation.
spec: [megatron.core.models.hybrid.hybrid_layer_specs, gated_delta_product_stack_spec]
hybrid-layer-pattern: "MEMEM*EMEMEM*EMEMEM*EMEMEM*EMEMEM*EMEMEMEM*EMEMEMEME/*E/*E"
hybrid-override-pattern: null
mtp-hybrid-override-pattern: null
mtp-num-layers: null
mtp-use-repeated-layer: true
mtp-loss-scaling-factor: "0.1"
calculate-per-token-loss: true

# Architecture
is-hybrid-model: true
hidden-size: 2688
ffn-hidden-size: 1856
num-attention-heads: 32
group-query-attention: true
num-query-groups: 2
kv-channels: 128
mamba-num-heads: 16
mamba-num-groups: 16
mamba-head-dim: 64
mamba-state-dim: 128
init-method-std: "0.0173"
first-last-layers-bf16: false

# MoE
num-experts: 512
moe-latent-size: 672
moe-router-topk: 22
moe-ffn-hidden-size: 1856
moe-shared-expert-intermediate-size: 3712
moe-token-dispatcher-type: alltoall
moe-router-score-function: sigmoid
moe-router-topk-scaling-factor: "5.0"
moe-router-load-balancing-type: seq_aux_loss
moe-router-dtype: fp32
moe-aux-loss-coeff: "1e-4"
moe-router-enable-expert-bias: true
moe-grouped-gemm: true
moe-permute-fusion: false

# Sequence and tokenizer shape. CI keeps base.yaml's mock-data source while
# preserving the production NullTokenizer vocabulary and token IDs.
seq-length: 8192
max-position-embeddings: 8192
vocab-size: 204800
padded-vocab-size: 204800
null-tokenizer-eod-id: 2
null-tokenizer-pad-id: 11
num-workers: 4

# Optimizer and sample schedule
global-batch-size: 128
micro-batch-size: 1
train-samples: 122016000
lr-decay-style: WSD
lr-decay-samples: 122016000
lr-warmup-samples: 1024000
lr-wsd-decay-style: minus_sqrt
lr-wsd-decay-samples: 18302208
lr: "2.16e-4"
min-lr: "2.16e-6"
weight-decay: "0.1"
clip-grad: "1.0"
optimizer: dist_muon
adam-beta1: "0.9"
adam-beta2: "0.95"
muon-extra-scale-factor: "1.0"
muon-momentum: "0.9"
muon-scale-mode: spectral
muon-num-ns-steps: 16
muon-coefficient-type: polar_express
muon-scalar-optimizer: lion
lion-beta1: "0.95"
lion-beta2: "0.98"

# Adapt the production TP2/PP1 topology to 32 GPUs. EP16 keeps expert state
# sharded without introducing expert-tensor or pipeline-parallel communication;
# the static batch is divisible by dense DP at both 8 and 32 GB300 nodes.
tensor-model-parallel-size: 2
expert-model-parallel-size: 16
expert-tensor-parallel-size: 1
pipeline-model-parallel-size: 1
sequence-parallel: true
use-distributed-optimizer: true
overlap-grad-reduce: true
overlap-param-gather: true
no-gradient-accumulation-fusion: false
high-priority-stream-groups: ep
ddp-num-buckets: 8

# Activation offload and recomputation bound the MoE backward workspace.
fine-grained-activation-offloading: true
offload-modules: moe_act
recompute-granularity: selective
recompute-modules: moe_act

# The full-performance profile captures the modules validated by the Nano4
# performance run. The deterministic flavor removes graph capture uniformly.
attention-backend: flash
cuda-graph-impl: local
cuda-graph-modules: [mamba, attn]
use-fused-weighted-squared-relu: true
te-rng-tracker: true
no-load-rng: true

# Checkpointing. The harness supplies save/load paths and switches providers;
# these flags preserve the production sharding and async behavior.
ckpt-fully-parallel-save: true
ckpt-fully-parallel-load: true
async-save: true
use-persistent-ckpt-worker: true
ckpt-assume-constant-structure: true

# Logging and runtime
eval-interval: 1000
eval-iters: 0
log-interval: 100
log-memory-interval: 1000
log-params-norm: true
log-num-zeros-in-grad: true
log-throughput: true
log-progress: true
log-energy: true
logging-level: 20
timing-log-option: minmax
check-weight-hash-across-dp-replicas-interval: 20000
manual-gc: true
manual-gc-interval: 10
distributed-timeout-minutes: 10
exit-duration-in-mins: 235
disable-gloo-process-groups: true
disable-straggler-on-startup: true
straggler-minmax-count: 16

# Match the reference allocation ceiling for both execution modes. The CI
# checkpoint cadence is shorter than production so each job can collect three
# phase-2 checkpoints without spending 1,500 training iterations.
job_time_in_mins:
  srun:
    perf: 240
    detr: 240
