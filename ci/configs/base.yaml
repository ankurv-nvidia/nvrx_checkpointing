# Common model + training config shared by every native-checkpoint CI profile.
#
# Flattened to CLI args by the pretrain job: `key: value` -> `--key value`,
# `key: true` -> `--key`, `key: [a, b]` -> `--key a b`, `key: false`/null drops
# the flag. A profile (pico.yaml / nano3.yaml / nano4.yaml / ultra.yaml, selected by
# `--config <profile>`) deep-merges over this; the profile pins model size,
# routing top-k, and parallelism. Runtime values are supplied in code, not here:
# checkpoint provider/format/save-load, save/log/eval/exit intervals and
# train-iters, the data cache and tensorboard paths, and the default
# tensor/expert parallel sizes and global batch size (which scale with the
# runner's GPU count unless a profile pins them).
#
# Float and scientific-notation values are quoted so they reach the CLI verbatim.

# MTP
mtp-num-layers: 2
mtp-hybrid-override-pattern: "*E"
calculate-per-token-loss: true
mtp-loss-scaling-factor: "0.3"

# Architecture (model size — num-layers, hidden-size, ffn-hidden-size,
# mamba-num-heads, hybrid-override-pattern, num-experts, the MoE shared-expert
# size, and the bf16-tail depth — is pinned per profile).
is-hybrid-model: true
first-last-layers-bf16: true
untie-embeddings-and-output-weights: true
init-method-std: "0.014"
position-embedding-type: "none"
bf16: true
use-mcore-models: true
spec: [megatron.core.models.mamba.mamba_layer_specs, mamba_stack_spec]
num-attention-heads: 32
kv-channels: 128
moe-latent-size: 1024
num-layers-at-start-in-bf16: 0

# Parallelism (tensor/expert model-parallel sizes and global batch size are computed
# in code so the pico profile tracks the runner's GPU count; nano3/nano4/ultra pin them).
expert-tensor-parallel-size: 1
pipeline-model-parallel-size: 1
sequence-parallel: true
no-gradient-accumulation-fusion: true
use-distributed-optimizer: true
overlap-grad-reduce: true
overlap-param-gather: true
override-opt_param-scheduler: true

# MoE (routing top-k and its scaling factor are pinned per profile)
moe-token-dispatcher-type: alltoall
moe-router-score-function: sigmoid
moe-grouped-gemm: true
moe-aux-loss-coeff: "1e-4"
moe-router-enable-expert-bias: true
moe-router-dtype: fp32
moe-router-load-balancing-type: seq_aux_loss
moe-permute-fusion: true

# Fused ops / attention (fast path; the deterministic flavor swaps these for
# reproducible kernels).
attention-backend: flash
cross-entropy-loss-fusion: true
cross-entropy-fusion-impl: native
use-fused-weighted-squared-relu: true
squared-relu: true
te-rng-tracker: true
ddp-num-buckets: 10

# CUDA graphs over the mamba / attention / moe-router subgraphs, enabled for every
# profile. The perf and deterministic flavors keep them (checkpoints stay
# bit-identical, so the md5 gate is unaffected); the valgrind flavor strips them
# because graph capture is infeasible under memcheck.
cuda-graph-impl: local
cuda-graph-modules: [mamba, attn, moe_router]

# Data
mock-data: true
tokenizer-type: NullTokenizer
vocab-size: 256000

# Schedule / optimizer
lr-wsd-decay-style: minus_sqrt
micro-batch-size: 1
lr: "4.5e-4"
min-lr: "4.5e-6"
weight-decay: "0.1"
clip-grad: "1.0"
adam-beta1: "0.9"
adam-beta2: "0.95"

# Regularization
attention-dropout: "0.0"
hidden-dropout: "0.0"
disable-bias-linear: true
normalization: RMSNorm

# Logging
log-params-norm: true
log-num-zeros-in-grad: true
log-throughput: true
log-progress: true
logging-level: 20
straggler-minmax-count: 16
timing-log-option: minmax

# Misc
no-mmap-bin-files: true
no-create-attention-mask-in-dataloader: true
distributed-timeout-minutes: 30
num-workers: 1
disable-gloo-process-groups: true
async-save: true
async-strategy: nvrx

# The production recipe is sample-based (lr-decay-samples / lr-warmup-samples /
# lr-wsd-decay-samples + lr-decay-style WSD), but the CI run is iter-based
# (--train-iters), and megatron requires iters xor samples — so the sample-based
# decay horizon is omitted here. Only the LR magnitude (above) is matched.
lr-decay-samples: 38000
lr-decay-style: WSD
lr-warmup-samples: 2000
lr-wsd-decay-samples: 40000
train-samples: 51200

# CI job time budgets (minutes). Each use-case maps the job's sorted flavor chain
# (with a "default" fallback) to its budget; profiles override entries through the
# usual deep merge.
job_time_in_mins:
  # srun --time ceiling — jobs finish early — sized for the heaviest scale that
  # runs the flavor (nano4 8x4 perf needs ~50 minutes; the 8x4 in-allocation
  # deterministic gate runs the full routine twice).
  srun:
    default: 30
    perf: 60
    deterministic: 180
    deterministic-valgrind: 180
  # Budget for the phase-1 checkpoint to become durable before phase 2 loads it.
  # Memcheck serializes the server's fragment pipeline ~30x, so the valgrind
  # flavor legitimately needs most of an hour.
  phase1-flush:
    default: 30
    deterministic-valgrind: 60
