# Ultra3 55B hybrid-MoE architecture from
# scripts/sbatch/55b_hybrid_moe_25T_phase1_nvrx.sh. The CI harness supplies
# mock data, run length, checkpoint cadence/paths, and a node-scaled global
# batch size.

# Unified main/MTP layout. CI temporarily uses the first 60 reference layers
# so 16-node checkpoint runs retain enough memory headroom.
hybrid-layer-pattern: "MEMEMEM*EMEMEM*EMEMEMEM*EMEMEMEM*EMEMEM*EMEMEMEM*EMEMEMEM*EM/*E/*E"
hybrid-override-pattern: null
mtp-hybrid-override-pattern: null
mtp-num-layers: 2
mtp-use-repeated-layer: true
mtp-loss-scaling-factor: "0.1"

# Architecture
is-hybrid-model: true
spec: [megatron.core.models.mamba.mamba_layer_specs, mamba_stack_spec]
num-layers: 60
hidden-size: 8192
ffn-hidden-size: 5120
mamba-num-heads: 256
num-attention-heads: 64
group-query-attention: true
num-query-groups: 2
init-method-std: "0.0099"
seq-length: 8192
max-position-embeddings: 8192
vocab-size: 131072
first-last-layers-bf16: true
num-layers-at-end-in-bf16: 16

# MoE
num-experts: 512
moe-latent-size: 2048
moe-router-topk: 22
moe-router-topk-scaling-factor: "5.0"
moe-shared-expert-intermediate-size: 10240
moe-token-dispatcher-type: flex
moe-flex-dispatcher-backend: hybridep
moe-flex-dispatcher-num-sms: 32

# Parallelism. The launcher scales the global batch with the allocation.
tensor-model-parallel-size: 8
expert-model-parallel-size: 64
# The production FP4 recipe uses 2. CI uses 1 to bound activation memory on
# the 16-node allocation without changing the model architecture.
micro-batch-size: 1
no-gradient-accumulation-fusion: false

# Runtime shape from the reference recipe
fine-grained-activation-offloading: true
offload-modules: moe_act
recompute-granularity: selective
recompute-modules: moe_act
ddp-pad-buckets-for-high-nccl-busbw: true
high-priority-stream-groups: [ep]
manual-gc: true
manual-gc-interval: 10
disable-straggler-on-startup: true
distributed-timeout-minutes: 10
ckpt-fully-parallel-save: true
ckpt-fully-parallel-load: true
ckpt-fully-parallel-save-process-group: ep_dp
ckpt-fully-parallel-load-process-group: ep_dp

# Optimizer magnitude; the CI-sized sample horizon remains in base.yaml.
lr: "2.5e-4"
min-lr: "2.5e-6"
use-precision-aware-optimizer: true
main-grads-dtype: bf16
exp-avg-dtype: bf16
exp-avg-sq-dtype: bf16
grad-reduce-in-bf16: true

# Intentional precision-only divergence from ultra3bf16.
fp8-format: e4m3
fp8-recipe: mxfp8
moe-router-padding-for-quantization: true

job_time_in_mins:
  srun:
    perf: 120
    # The 64-node determinism gate runs a full NVRx reference routine before
    # the measured native routine. The reference half alone reached 171 minutes.
    deterministic: 360

# awscmh's batch partition has a four-hour MaxTime; batch_long uses the same
# nodes and permits up to seven days. This six-hour determinism gate cannot fit
# on batch (verified by scontrol/sinfo in CI pipeline 60804028).
job_partition:
  awscmh:
    deterministic: batch_long
