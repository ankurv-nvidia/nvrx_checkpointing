# One-node GPT-MoE checkpoint regression of Megatron-FSDP, whose fsdp_dtensor checkpoints hold its
# DTensor state as plain DCP checkpoints.
inherits: gpt_moe

use-megatron-fsdp: true
data-parallel-sharding-strategy: optim_grads_params
ckpt-format: fsdp_dtensor

# As in Megatron-LM's Megatron-FSDP tests: experts without tensor parallelism, unquantized
# parameters, unfused gradient accumulation.
expert-tensor-parallel-size: 1
fp8-format: null
fp8-recipe: null
fp8-param-gather: false
no-gradient-accumulation-fusion: true
