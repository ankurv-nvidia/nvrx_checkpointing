# ultra profile: a large Mamba-hybrid MoE model with fixed parallelism, run at
# 16 nodes. Deep-merged over base.yaml; only the keys that differ from base are
# listed (everything else — MTP, MoE routing recipe, fused ops, optimizer,
# logging, ...) is inherited.

# Model size
num-layers: 44
hidden-size: 4096
ffn-hidden-size: 2688
mamba-num-heads: 128
hybrid-override-pattern: "MEMEMEM*EMEMEMEM*EMEMEMEM*EMEMEMEM*EMEMEMEME"
num-experts: 512
moe-shared-expert-intermediate-size: 5376
num-layers-at-end-in-bf16: 14

# Routing
moe-router-topk: 22
moe-router-topk-scaling-factor: "5.0"

# Parallelism + batch size (pinned, not scaled to the runner's GPU count)
tensor-model-parallel-size: 2
expert-model-parallel-size: 64
