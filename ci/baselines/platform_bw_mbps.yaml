# Eight ranks share four D2H staging queues, so the four on the far NUMA
# socket pay a cross-socket penalty and the aggregate swings by about a
# third between runs of the same code: 23865 to 34000+ MB/s observed. No
# +-5% band holds that, so the floor clears the slowest run rather than
# failing healthy ones. Narrowing it needs the queue-per-rank fix, not a
# tighter number.
devbox: 6800
h100: 24000
gb200: 115000
gb300: 115000
